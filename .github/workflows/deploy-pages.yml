name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------- TEST JOB ----------
  # Validates that every HTML file is parseable and that all internal links
  # resolve to real local files. Blocks deployment if anything is broken.
  test:
    name: Test site (HTML + link validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show repo structure summary
        run: |
          echo "=== Repo contents (top level) ==="
          ls -la
          echo ""
          echo "=== getartcraft.com/ file count ==="
          find getartcraft.com -type f | wc -l
          echo ""
          echo "=== Total repo size ==="
          du -sh .

      - name: Run website tests
        run: python3 scripts/test_website.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            getartcraft.com/**/*.html
            scripts/

  # ---------- DEPLOY JOB ----------
  # Uploads the getartcraft.com/ directory as a Pages artifact and deploys it.
  # Only runs after the test job succeeds.
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages site is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Checking if Pages site is enabled on this repo..."
          STATUS=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          if [ "$STATUS" = "200" ]; then
            echo "Pages site already enabled. Current config:"
            cat /tmp/pages.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))"
            BUILD_TYPE=$(cat /tmp/pages.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('build_type', 'unknown'))")
            if [ "$BUILD_TYPE" != "workflow" ]; then
              echo "Pages build_type is '$BUILD_TYPE', updating to 'workflow'..."
              curl -s -X PUT \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/${{ github.repository }}/pages \
                -d '{"build_type": "workflow"}'
            fi
          else
            echo "Pages site is NOT enabled (HTTP $STATUS). Attempting to enable..."
            ENABLE_RESULT=$(curl -s -o /tmp/enable.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type": "workflow"}')
            if [ "$ENABLE_RESULT" = "201" ] || [ "$ENABLE_RESULT" = "200" ]; then
              echo "Pages site enabled successfully!"
              cat /tmp/enable.json
            else
              echo "FAILED to enable Pages site (HTTP $ENABLE_RESULT):"
              cat /tmp/enable.json
              echo ""
              echo "============================================================"
              echo "MANUAL SETUP REQUIRED:"
              echo "Please visit https://github.com/${{ github.repository }}/settings/pages"
              echo "and set 'Build and deployment' -> 'Source' = 'GitHub Actions'."
              echo "Then re-run this workflow."
              echo "============================================================"
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: getartcraft.com

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
